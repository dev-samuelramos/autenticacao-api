services:
  postgres:
    image: postgres:16-alpine
    container_name: parking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking123
      POSTGRES_DB: parking_db
    ports:
      - "5434:5432"
    volumes:
      - parking_pgdata:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16-alpine
    container_name: parking_postgres_test
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking123
      POSTGRES_DB: parking_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  parking_pgdata: